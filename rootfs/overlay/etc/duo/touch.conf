# Touch tuning, read by duoheat at start (NAME=value; overrides the environment). Every panel is a little
# different: measure yours with `duo-touch-test A` and `duo-touch-test B` (12 targets each, results in
# /root/duo-touch-A.json / -B.json), then adjust and reboot. (Restarting duoheat alone recreates the touch
# devices: duo-ecrans / lisgd must be restarted too, or the 3-finger gestures stop working.)
#
# Edge stretches (1.0 = none): the outer columns pull touches inwards on some panels.
#DUO_X_STRETCH_A_G=1.25
#DUO_X_STRETCH_A_D=1.25
#DUO_X_STRETCH_B_G=1.0
#DUO_X_STRETCH_B_D=1.25
#DUO_Y_STRETCH=1.25
# Constant offsets in physical pixels (panels are 1350x1800), e.g. if every tap lands a bit low: DUO_Y_OFFSET_A=-15
#DUO_X_OFFSET_A=0
#DUO_Y_OFFSET_A=0
#DUO_X_OFFSET_B=0
#DUO_Y_OFFSET_B=0
# Lift detection: the controller goes silent when the finger lifts; report the lift after this many ms.
# Buttons react on release, so this delay is felt on every tap. 40 tested fine at ~100 Hz.
DUO_QUIET_MS=40
